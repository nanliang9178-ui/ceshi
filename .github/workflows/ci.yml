name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 安装与构建
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成 Prisma Client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: 构建 shared / api / admin / h5
        run: npm run build

      - name: 校验产物
        run: |
          test -f apps/api/dist/main.js
          test -f apps/admin/dist/index.html
          test -f apps/h5/dist/index.html
          echo "所有产物已生成"

  smoke:
    name: 接口冒烟
    runs-on: ubuntu-latest
    needs: build
    env:
      DATABASE_URL: file:./smoke.db
      JWT_SECRET: ci-only-secret-not-for-production
      ALLOW_MOCK_PAY: 'true'
      PORT: '3000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 初始化数据库与演示数据
        run: |
          npx prisma generate --schema apps/api/prisma/schema.prisma
          npm run build:shared
          npm run build -w @tianshu/api
          npx prisma db push --schema apps/api/prisma/schema.prisma
          npm run seed

      - name: 启动 API 并验证核心接口
        run: |
          node apps/api/dist/main.js &
          API_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/client/bootstrap?tenantCode=demo > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/api/client/bootstrap?tenantCode=demo | head -c 200
          echo
          curl -sf "http://127.0.0.1:3000/api/client/menu?tenantCode=demo" > /dev/null
          echo "菜单接口正常"
          kill $API_PID
